[package]
name = "flume"
version = "0.1.0"
edition = "2024"
description = "The Rill formatter: reads a file on stdin and writes it formatted to stdout."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"

[dev-dependencies]
# Only for tests: formatted output must parse to the same tree as the input.
rill = { path = "..", default-features = false }
